<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ME-List - Login</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#7C8F6E">
  <script>
    if (localStorage.getItem('checklist_tema') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script defer src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "fd6caeb2-d548-411d-b45d-6312724e90b4",
      });
    });
  </script>
</head>
<body class="tela-login">

  <canvas id="sakura-canvas"></canvas>

  <div class="cartao">
    <h1>ME-List</h1>
    <p>Entre com sua conta Google para começar</p>

    <div class="area-login">
      <div id="botaoGoogle"></div>
    </div>

    <div class="area-codigo" id="areaCodigo">
      <p style="margin:0;">Primeiro acesso. Digite seu código de liberação:</p>
      <input type="text" id="campoCodigo" placeholder="Código de acesso">
      <button class="botao-principal" onclick="enviarCadastro()">Confirmar</button>
    </div>

    <div class="mensagem" id="mensagem"></div>
  </div>

  <script src="config.js"></script>
  <script>
    // ----- sakura: pétalas caindo, leve e discreta, atrás do cartão -----
    (function () {
      const raiz = document.documentElement;
      const canvas = document.getElementById('sakura-canvas');
      const ctx = canvas.getContext('2d');
      let largura, altura, petalas = [], animando = true, frame = null;

      function corPetala() {
        const escuro = raiz.getAttribute('data-theme') === 'dark';
        // rosa-sakura, puxado um pouco pro dourado no tema escuro pra
        // conversar com a paleta --classico/--brilho já existente.
        return escuro
          ? ['rgba(255,205,214,', 'rgba(240,212,138,']
          : ['rgba(205,120,142,', 'rgba(184,130,87,'];
      }

      function redimensionar() {
        largura = canvas.width = window.innerWidth;
        altura = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', redimensionar);
      redimensionar();

      function criarPetala() {
        return {
          x: Math.random() * largura,
          y: -20 - Math.random() * altura,
          tamanho: 9 + Math.random() * 9,
          velocidadeY: 0.5 + Math.random() * 0.8,
          velocidadeX: 0.3 + Math.random() * 0.5,
          fase: Math.random() * Math.PI * 2,
          rotacao: Math.random() * Math.PI * 2,
          velocidadeRotacao: (Math.random() - 0.5) * 0.02,
          opacidade: 0.55 + Math.random() * 0.4,
          dourada: Math.random() < 0.3,
        };
      }

      const QUANTIDADE = Math.min(36, Math.round((window.innerWidth * window.innerHeight) / 34000));
      for (let i = 0; i < QUANTIDADE; i++) petalas.push(criarPetala());

      // Desenha uma pétala de verdade (gota arredondada numa ponta, com
      // um leve recorte na outra) em vez de uma elipse lisa -- em canvas,
      // nunca com path SVG escrito à mão.
      function tracarPetala(tamanho) {
        const s = tamanho;
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.bezierCurveTo(s * 0.75, -s * 0.55, s * 0.68, s * 0.55, s * 0.1, s * 0.92);
        ctx.quadraticCurveTo(0, s * 1.08, -s * 0.1, s * 0.92);
        ctx.bezierCurveTo(-s * 0.68, s * 0.55, -s * 0.75, -s * 0.55, 0, -s);
        ctx.closePath();
      }

      function desenharPetala(p) {
        const [rosa, dourado] = corPetala();
        const escuro = raiz.getAttribute('data-theme') === 'dark';
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotacao);
        if (escuro) {
          ctx.shadowColor = (p.dourada ? dourado : rosa) + '0.9)';
          ctx.shadowBlur = p.tamanho * 0.8;
        }
        tracarPetala(p.tamanho);
        ctx.fillStyle = (p.dourada ? dourado : rosa) + p.opacidade + ')';
        ctx.fill();
        ctx.restore();
      }

      function tick() {
        ctx.clearRect(0, 0, largura, altura);
        petalas.forEach(p => {
          p.fase += 0.012;
          p.y += p.velocidadeY;
          p.x += p.velocidadeX * Math.sin(p.fase);
          p.rotacao += p.velocidadeRotacao;
          if (p.y > altura + 20) {
            p.y = -20;
            p.x = Math.random() * largura;
          }
          desenharPetala(p);
        });
        if (animando) frame = requestAnimationFrame(tick);
      }

      const prefereReduzido = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!prefereReduzido) {
        tick();
      }
    })();

    let tokenAtual = null;

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: aoReceberCredencial
      });
      google.accounts.id.renderButton(
        document.getElementById('botaoGoogle'),
        { theme: 'outline', size: 'large', text: 'signin_with' }
      );
    };

    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = 'mensagem ' + (tipo || '');
    }

    async function aoReceberCredencial(resposta) {
      tokenAtual = resposta.credential;
      mostrarMensagem('Verificando...', 'info');

      try {
        const dados = await chamarBackend('login', { token: tokenAtual });

        if (!dados.ok) {
          mostrarMensagem(dados.erro, 'erro');
          return;
        }

        if (dados.cadastrado) {
          salvarSessao(dados);
          window.location.href = 'index.html';
          return;
        }

        mostrarMensagem('Bem-vinda, ' + dados.nome + '. Digite seu código de acesso.', 'info');
        document.getElementById('areaCodigo').classList.add('visivel');
      } catch (erro) {
        console.error('Falha ao verificar login:', erro);
        mostrarMensagem('Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.', 'erro');
      }
    }

    async function enviarCadastro() {
      const codigo = document.getElementById('campoCodigo').value.trim();
      if (!codigo) {
        mostrarMensagem('Digite o código de acesso', 'erro');
        return;
      }

      mostrarMensagem('Validando código...', 'info');

      try {
        const dados = await chamarBackend('cadastrar', { token: tokenAtual, codigo: codigo });

        if (!dados.ok) {
          mostrarMensagem(dados.erro, 'erro');
          return;
        }

        salvarSessao(dados);
        window.location.href = 'index.html';
      } catch (erro) {
        console.error('Falha ao confirmar cadastro:', erro);
        mostrarMensagem('Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.', 'erro');
      }
    }

    async function chamarBackend(acao, dadosExtras) {
      const corpo = Object.assign({ action: acao }, dadosExtras);
      const resposta = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(corpo)
      });

      if (!resposta.ok) {
        throw new Error('Servidor respondeu com status ' + resposta.status);
      }

      const texto = await resposta.text();
      try {
        return JSON.parse(texto);
      } catch (erro) {
        console.error('Resposta inesperada do servidor:', texto);
        throw new Error('Resposta inesperada do servidor');
      }
    }

    function salvarSessao(dados) {
      localStorage.setItem('checklist_email', dados.email);
      localStorage.setItem('checklist_nome', dados.nome);
      localStorage.setItem('checklist_idPlanilha', dados.idPlanilha);
      localStorage.setItem('checklist_horarioLembrete', dados.horarioLembrete || '');
    }
  </script>
</body>
</html>
