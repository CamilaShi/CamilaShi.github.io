<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Checklists - Checklist Melissa</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#7C8F6E">
  <script>
    if (localStorage.getItem('checklist_tema') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script defer src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "fd6caeb2-d548-411d-b45d-6312724e90b4",
      });
    });
  </script>
</head>
<body>

  <div class="particulas" id="particulas"></div>

  <div class="app">
    <aside class="barra-lateral">
      <div class="linha-saudacao">
        <div class="saudacao-menu" id="saudacaoMenu">Oi! &#128075;</div>
        <label class="interruptor-tema" aria-label="Alternar tema">
          <input type="checkbox" id="toggleTema" onchange="alternarTema()">
          <span class="interruptor-tema-trilho">
            <span class="interruptor-tema-bola"></span>
            <span class="interruptor-tema-icone" id="iconeTema">&#9728;</span>
          </span>
        </label>
      </div>

      <nav class="nav-lista">
        <button class="nav-item" onclick="irPara('index.html')">
          <span class="nav-icone">&#9671;</span> Dashboard
        </button>
        <button class="nav-item ativo">
          <span class="nav-icone">&#10003;</span> Meus Checklists
        </button>
        <button class="nav-item" onclick="irPara('historico.html')">
          <span class="nav-icone">&#8986;</span> Histórico
        </button>
        <button class="nav-item" onclick="irPara('configuracoes.html')">
          <span class="nav-icone">&#9881;</span> Configurações
        </button>
      </nav>

      <div class="nav-rodape">
        <div class="linha-sair">
          <button class="nav-item" onclick="sair()">
            <span class="nav-icone">&#8617;</span> Sair
          </button>
          <label class="interruptor-tema" aria-label="Alternar tema">
            <input type="checkbox" id="toggleTemaRodape" onchange="alternarTema()">
            <span class="interruptor-tema-trilho">
              <span class="interruptor-tema-bola"></span>
              <span class="interruptor-tema-icone" id="iconeTemaRodape">&#9728;</span>
            </span>
          </label>
        </div>
      </div>
    </aside>

    <main class="conteudo">

      <!-- VISTA: lista de checklists -->
      <div id="vistaLista">
        <div class="topo">
          <div class="selo-topo">Painel</div>
          <h1>Meus Checklists</h1>
        </div>
        <div class="grade-checklists" id="gradeChecklists">
          <div class="estado-vazio">Carregando...</div>
        </div>
      </div>

      <!-- VISTA: itens de um checklist -->
      <div id="vistaItens" style="display:none;">
        <button class="botao-voltar" onclick="voltarParaLista()">&#8592; Voltar para Meus Checklists</button>
        <div class="painel-itens">
          <div class="painel-itens-topo">
            <h2 id="tituloChecklist">Checklist</h2>
            <span class="widget-tag" id="dataAtual"></span>
          </div>
          <div class="progresso-painel" id="progressoPainel">
            <div class="progresso-texto">
              <span id="progressoTexto">0 de 0 concluídos</span>
              <span class="progresso-percentual" id="progressoPercentual">0%</span>
            </div>
            <div class="progresso-trilha"><span id="progressoBarra" style="width:0%"></span></div>
          </div>

          <div class="linha-agenda">
            <span class="rotulo-agenda" title="Usa a mesma conta Google do seu login">Avisar na minha agenda Google</span>
            <label class="interruptor">
              <input type="checkbox" id="toggleAgenda" onchange="alternarNotificacaoAgenda()">
              <span class="interruptor-trilho"><span class="interruptor-bola"></span></span>
            </label>
            <select id="horaAgenda" class="select-hora" disabled onchange="salvarHorarioAgenda()"></select>
          </div>
          <div class="acoes-itens" id="acoesNormais">
            <div class="acoes-itens-esquerda">
              <button class="botao-mini" onclick="marcarTodos(true)">Marcar tudo</button>
              <button class="botao-mini" onclick="marcarTodos(false)">Limpar tudo</button>
            </div>
            <button class="botao-mini" onclick="alternarModoEdicao()">Editar</button>
          </div>
          <div class="acoes-itens" id="acoesEdicao" style="display:none;">
            <button class="botao-mini" onclick="renomearChecklistAtual()">Renomear</button>
            <button class="botao-mini botao-perigo" onclick="excluirChecklistAtual()">Excluir checklist</button>
            <button class="botao-mini botao-perigo" onclick="excluirSelecionados()">&#128465; Excluir marcados</button>
            <button class="botao-mini" onclick="alternarModoEdicao()">Concluir edição</button>
          </div>
          <div class="lista-itens" id="listaItens">
            <div class="estado-vazio">Carregando...</div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="config.js"></script>
  <script>
    let idPlanilha = null;
    let painel = { checklists: [] };
    let checklistAtual = null;
    let itensAtuais = [];
    let modoEdicao = false;
    let itensSelecionados = new Set();
    let idArrastado = null;
    const dataHoje = new Date().toISOString().substring(0, 10);

    const ICONES = [
      { chaves: ['dia a dia', 'diario', 'rotina'], icone: '&#8962;' },
      { chaves: ['viagem', 'mala'], icone: '&#9992;' },
      { chaves: ['compra', 'mercado'], icone: '&#128722;' },
      { chaves: ['estudo', 'estudar', 'curso'], icone: '&#128214;' },
      { chaves: ['trabalho', 'reuniao'], icone: '&#128188;' },
      { chaves: ['casa', 'limpeza'], icone: '&#127968;' }
    ];

    function escolherIcone(nome) {
      const alvo = nome.toLowerCase();
      for (const item of ICONES) {
        if (item.chaves.some(c => alvo.indexOf(c) !== -1)) return item.icone;
      }
      return '&#10022;';
    }

    window.onload = function () {
      const email = localStorage.getItem('checklist_email');
      const nome = localStorage.getItem('checklist_nome');
      idPlanilha = localStorage.getItem('checklist_idPlanilha');

      if (!email) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('saudacaoMenu').textContent = 'Oi, ' + nome.split(' ')[0] + '! \u{1F44B}';
      document.getElementById('dataAtual').textContent = dataHoje.split('-').reverse().join('/');

      const temaAtual = document.documentElement.getAttribute('data-theme');
      document.getElementById('toggleTema').checked = temaAtual === 'dark';
      document.getElementById('iconeTema').innerHTML = temaAtual === 'dark' ? '&#9790;' : '&#9728;';

      criarParticulas();
      carregarChecklists();
      identificarUsuarioNotificacoes(email);
    };

    function identificarUsuarioNotificacoes(email) {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.login(email);
      });
    }

    function irPara(pagina) {
      window.location.href = pagina;
    }

    // Pede à usuária autorização pra sua própria agenda do Google. Se ela
    // já autorizou antes nesse navegador, o Google costuma liberar o
    // token sem mostrar tela nenhuma. aoReceber(token) só é chamado em
    // caso de sucesso; em caso de falha/recusa, mostra um alerta.
    function obterTokenAgenda(aoReceber) {
      if (!window.google || !google.accounts || !google.accounts.oauth2) {
        alert('Ainda carregando a autorização do Google. Tente de novo em alguns segundos.');
        return;
      }

      const email = localStorage.getItem('checklist_email');
      const cliente = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/calendar.events',
        hint: email || undefined,
        callback: function (resposta) {
          if (resposta.error) {
            alert('Não foi possível conectar com sua agenda do Google. Tente novamente e use a mesma conta do seu login (' + email + ').');
            return;
          }
          aoReceber(resposta.access_token);
        }
      });
      cliente.requestAccessToken();
    }

    function sair() {
      localStorage.removeItem('checklist_email');
      localStorage.removeItem('checklist_nome');
      localStorage.removeItem('checklist_idPlanilha');
      window.location.href = 'login.html';
    }

    function alternarTema() {
      const raiz = document.documentElement;
      const atual = raiz.getAttribute('data-theme');
      const novo = atual === 'dark' ? 'light' : 'dark';
      raiz.setAttribute('data-theme', novo);
      localStorage.setItem('checklist_tema', novo);
      document.getElementById('iconeTema').innerHTML = novo === 'dark' ? '&#9790;' : '&#9728;';
    }

    function criarParticulas() {
      const container = document.getElementById('particulas');
      const tema = document.documentElement.getAttribute('data-theme');
      const total = tema === 'light' ? 29 : 22;
      const faixas = 4;
      for (let i = 0; i < total; i++) {
        const p = document.createElement('div');
        p.className = 'particula';
        const faixa = i % faixas;
        const altoMin = faixa * (100 / faixas);
        const altoMax = altoMin + (100 / faixas);
        p.style.left = Math.random() * 100 + 'vw';
        p.style.top = (altoMin + Math.random() * (altoMax - altoMin)) + 'vh';
        p.style.animationDelay = (Math.random() * 9) + 's';
        p.style.animationDuration = (7 + Math.random() * 5) + 's';
        container.appendChild(p);
      }
    }

    async function chamarBackend(acao, dadosExtras) {
      const corpo = Object.assign({ action: acao }, dadosExtras);
      const resposta = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(corpo)
      });
      return resposta.json();
    }

    // Dispara a chamada ao backend sem bloquear a tela. Se falhar, roda "aoFalhar"
    // para desfazer a mudança otimista que já foi mostrada.
    function chamarBackendEmSegundoPlano(acao, dadosExtras, aoFalhar) {
      chamarBackend(acao, dadosExtras).then(function (resultado) {
        if (!resultado.ok && aoFalhar) aoFalhar(resultado.erro || 'Falha ao salvar');
      }).catch(function () {
        if (aoFalhar) aoFalhar('Falha de conexão');
      });
    }

    async function carregarChecklists() {
      const grade = document.getElementById('gradeChecklists');
      const dados = await chamarBackend('obterPainel', { idPlanilha: idPlanilha, data: dataHoje });

      if (!dados.ok) {
        grade.innerHTML = '<div class="estado-vazio">' + dados.erro + '</div>';
        return;
      }

      painel.checklists = dados.checklists;
      renderizarGrade();
    }

    function renderizarGrade() {
      const grade = document.getElementById('gradeChecklists');
      grade.innerHTML = '';

      for (const cl of painel.checklists) {
        const total = cl.itens.length;
        const feitos = cl.itens.filter(i => i.marcado).length;
        const pct = total ? Math.round((feitos / total) * 100) : 0;

        const card = document.createElement('div');
        card.className = 'card-checklist';
        card.onclick = () => abrirChecklist(cl.id);
        card.innerHTML =
          '<div class="widget-titulo"><span class="icone-widget">' + escolherIcone(cl.nome) + '</span> ' + cl.nome + '</div>' +
          '<div class="card-checklist-progresso"><span style="width:' + pct + '%"></span></div>' +
          '<div class="card-checklist-rodape"><span>' + feitos + '/' + total + ' feitos</span><span>' + pct + '%</span></div>';
        grade.appendChild(card);
      }

      const cardNovo = document.createElement('div');
      cardNovo.className = 'card-checklist card-novo';
      cardNovo.onclick = criarChecklist;
      cardNovo.innerHTML = '<span class="simbolo-novo">+</span>Novo checklist';
      grade.appendChild(cardNovo);
    }

    function criarChecklist() {
      const nome = prompt('Nome do novo checklist:');
      if (!nome || !nome.trim()) return;

      const idTemporario = 'tmp-' + Date.now();
      const novoChecklist = { id: idTemporario, nome: nome.trim(), itens: [] };
      painel.checklists.push(novoChecklist);
      renderizarGrade();

      chamarBackend('criarChecklist', { idPlanilha: idPlanilha, nome: novoChecklist.nome }).then(function (resultado) {
        if (!resultado.ok) {
          painel.checklists = painel.checklists.filter(c => c.id !== idTemporario);
          renderizarGrade();
          alert(resultado.erro);
          return;
        }
        novoChecklist.id = resultado.id;
      }).catch(function () {
        painel.checklists = painel.checklists.filter(c => c.id !== idTemporario);
        renderizarGrade();
        alert('Falha de conexão ao criar o checklist.');
      });
    }

    function abrirChecklist(id) {
      checklistAtual = painel.checklists.find(c => c.id === id);
      if (!checklistAtual) return;
      itensAtuais = checklistAtual.itens;
      modoEdicao = false;
      itensSelecionados.clear();

      document.getElementById('tituloChecklist').textContent = checklistAtual.nome;
      document.getElementById('vistaLista').style.display = 'none';
      document.getElementById('vistaItens').style.display = 'block';
      document.getElementById('acoesNormais').style.display = 'flex';
      document.getElementById('acoesEdicao').style.display = 'none';
      renderizarItens();
      configurarLinhaAgenda();
    }

    function preencherSeletorHorarioAgenda() {
      const select = document.getElementById('horaAgenda');
      select.innerHTML = '';
      for (let h = 0; h < 24; h++) {
        for (let m = 0; m < 60; m += 30) {
          const valor = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
          const opcao = document.createElement('option');
          opcao.value = valor;
          opcao.textContent = valor;
          select.appendChild(opcao);
        }
      }
    }

    function configurarLinhaAgenda() {
      const toggle = document.getElementById('toggleAgenda');
      const select = document.getElementById('horaAgenda');

      if (!select.options.length) preencherSeletorHorarioAgenda();

      toggle.checked = !!checklistAtual.notificarAgenda;
      select.disabled = !toggle.checked;
      select.value = checklistAtual.horarioAgenda || '08:00';
    }

    function alternarNotificacaoAgenda() {
      const toggle = document.getElementById('toggleAgenda');
      const select = document.getElementById('horaAgenda');
      const horarioAnterior = checklistAtual.horarioAgenda;
      const notificarAnterior = checklistAtual.notificarAgenda;

      select.disabled = !toggle.checked;
      checklistAtual.notificarAgenda = toggle.checked;
      if (!select.value) select.value = '08:00';

      function desfazer(mensagem) {
        toggle.checked = notificarAnterior;
        select.disabled = !notificarAnterior;
        checklistAtual.notificarAgenda = notificarAnterior;
        checklistAtual.horarioAgenda = horarioAnterior;
        if (mensagem) alert(mensagem);
      }

      function enviar(token) {
        chamarBackend('definirNotificacaoAgenda', {
          idPlanilha: idPlanilha,
          idChecklist: checklistAtual.id,
          notificar: toggle.checked,
          horario: select.value,
          tokenAgenda: token
        }).then(function (resultado) {
          if (!resultado.ok) { desfazer(resultado.erro || 'Não foi possível salvar.'); return; }
          checklistAtual.horarioAgenda = select.value;
        }).catch(function () { desfazer('Falha de conexão ao salvar o aviso na agenda.'); });
      }

      if (toggle.checked) {
        // Ativando: precisa autorizar (ou reaproveitar a autorização) da
        // agenda Google antes de mandar pro backend.
        obterTokenAgenda(enviar);
      } else {
        // Desligando: ainda pede o token pra poder apagar o evento já
        // criado antes; se recusar, desliga só localmente de qualquer jeito.
        obterTokenAgenda(enviar);
      }
    }

    function salvarHorarioAgenda() {
      const select = document.getElementById('horaAgenda');
      const horarioAnterior = checklistAtual.horarioAgenda;
      checklistAtual.horarioAgenda = select.value;

      obterTokenAgenda(function (token) {
        chamarBackend('definirNotificacaoAgenda', {
          idPlanilha: idPlanilha,
          idChecklist: checklistAtual.id,
          notificar: true,
          horario: select.value,
          tokenAgenda: token
        }).then(function (resultado) {
          if (!resultado.ok) {
            select.value = horarioAnterior;
            checklistAtual.horarioAgenda = horarioAnterior;
            alert(resultado.erro || 'Não foi possível salvar.');
          }
        }).catch(function () {
          select.value = horarioAnterior;
          checklistAtual.horarioAgenda = horarioAnterior;
          alert('Falha de conexão ao salvar o horário.');
        });
      });
    }

    function voltarParaLista() {
      document.getElementById('vistaItens').style.display = 'none';
      document.getElementById('vistaLista').style.display = 'block';
      renderizarGrade();
    }

    function alternarModoEdicao() {
      modoEdicao = !modoEdicao;
      itensSelecionados.clear();
      document.getElementById('acoesNormais').style.display = modoEdicao ? 'none' : 'flex';
      document.getElementById('acoesEdicao').style.display = modoEdicao ? 'flex' : 'none';
      renderizarItens();
    }

    // Monta a linha de um item (checkbox marcável, ou modo edição com
    // renomear/excluir). Reaproveitada tanto para itens soltos quanto
    // para itens dentro de uma seção.
    function criarLinhaItem(item) {
      const linha = document.createElement('div');
      ativarArrasto(linha, item);

      if (modoEdicao) {
        const selecionado = itensSelecionados.has(item.id);
        linha.className = 'item-check item-edicao' + (selecionado ? ' selecionado' : '');

        const alca = document.createElement('span');
        alca.className = 'alca-arrastar';
        alca.innerHTML = '&#10287;';

        const caixa = document.createElement('div');
        caixa.className = 'caixa-check';
        caixa.innerHTML = selecionado ? '&#10003;' : '';
        caixa.onclick = () => toggleSelecao(item.id);

        const texto = document.createElement('span');
        texto.className = 'texto-item';
        texto.textContent = item.descricao;
        texto.onclick = () => toggleSelecao(item.id);

        const renomear = document.createElement('button');
        renomear.className = 'icone-renomear';
        renomear.innerHTML = '&#9999;';
        renomear.onclick = (ev) => { ev.stopPropagation(); renomearItemUnico(item.id); };

        const lixeira = document.createElement('button');
        lixeira.className = 'icone-lixeira';
        lixeira.innerHTML = '&#128465;';
        lixeira.onclick = (ev) => { ev.stopPropagation(); excluirItemUnico(item.id); };

        linha.appendChild(alca);
        linha.appendChild(caixa);
        linha.appendChild(texto);
        linha.appendChild(renomear);
        linha.appendChild(lixeira);
      } else {
        linha.className = 'item-check' + (item.marcado ? ' marcado' : '');
        linha.onclick = () => alternarItem(item.id);
        linha.innerHTML =
          '<span class="alca-arrastar">&#10287;</span>' +
          '<div class="caixa-check">' + (item.marcado ? '&#10003;' : '') + '</div>' +
          '<span class="texto-item">' + item.descricao + '</span>' +
          '';
      }

      return linha;
    }

    // Monta o bloco de uma seção: título em negrito, progresso próprio
    // (itens marcados / total da seção), botão Excluir e, dentro, os
    // itens dela + um campo para adicionar um novo item só ali.
    function criarBlocoSecao(secao, itensDaSecao) {
      const bloco = document.createElement('div');
      bloco.className = 'bloco-secao';

      const total = itensDaSecao.length;
      const feitos = itensDaSecao.filter(i => i.marcado).length;
      const pct = total ? Math.round((feitos / total) * 100) : 0;

      const cabecalho = document.createElement('div');
      cabecalho.className = 'secao-cabecalho';

      const titulo = document.createElement('span');
      titulo.className = 'secao-titulo';
      titulo.textContent = secao.nome;

      const contagem = document.createElement('span');
      contagem.className = 'secao-contagem';
      contagem.textContent = feitos + '/' + total;

      const excluir = document.createElement('button');
      excluir.className = 'botao-mini botao-perigo botao-excluir-secao';
      excluir.textContent = 'Excluir';
      excluir.onclick = (ev) => { ev.stopPropagation(); excluirSecaoAtual(secao.id); };

      cabecalho.appendChild(titulo);
      cabecalho.appendChild(contagem);
      cabecalho.appendChild(excluir);
      bloco.appendChild(cabecalho);

      const linhaProgresso = document.createElement('div');
      linhaProgresso.className = 'secao-progresso-linha';

      const percentual = document.createElement('span');
      percentual.className = 'secao-percentual';
      percentual.textContent = pct + '%';
      linhaProgresso.appendChild(percentual);

      const trilha = document.createElement('div');
      trilha.className = 'secao-progresso-trilha';
      trilha.innerHTML = '<span style="width:' + pct + '%"></span>';
      linhaProgresso.appendChild(trilha);

      bloco.appendChild(linhaProgresso);

      const listaSecao = document.createElement('div');
      listaSecao.className = 'secao-itens';
      if (!itensDaSecao.length) {
        listaSecao.innerHTML = '<div class="estado-vazio estado-vazio-secao">Nenhum item nesta seção ainda.</div>';
      } else {
        for (const item of itensDaSecao) listaSecao.appendChild(criarLinhaItem(item));
      }
      bloco.appendChild(listaSecao);

      const linhaNovo = document.createElement('div');
      linhaNovo.className = 'linha-novo-item linha-novo-item-secao';
      const campo = document.createElement('input');
      campo.type = 'text';
      campo.placeholder = 'Novo item em ' + secao.nome + '...';
      const botao = document.createElement('button');
      botao.className = 'botao-mini';
      botao.textContent = '+ Adicionar';
      botao.onclick = () => adicionarItem(secao.id, campo);
      linhaNovo.appendChild(campo);
      linhaNovo.appendChild(botao);
      bloco.appendChild(linhaNovo);

      return bloco;
    }

    function renderizarItens() {
      const lista = document.getElementById('listaItens');
      atualizarProgresso();
      lista.innerHTML = '';

      const secoes = checklistAtual.secoes || [];
      const itensSemSecao = itensAtuais.filter(i => !i.idSecao);
      const itensPorSecao = {};
      for (const secao of secoes) itensPorSecao[secao.id] = [];
      for (const item of itensAtuais) {
        if (item.idSecao && itensPorSecao[item.idSecao]) itensPorSecao[item.idSecao].push(item);
      }

      if (!itensAtuais.length && !secoes.length) {
        lista.innerHTML = '<div class="estado-vazio">Nenhuma lista ainda. Crie uma lista abaixo para começar a adicionar itens.</div>';
      }

      for (const item of itensSemSecao) {
        lista.appendChild(criarLinhaItem(item));
      }

      for (const secao of secoes) {
        lista.appendChild(criarBlocoSecao(secao, itensPorSecao[secao.id] || []));
      }

      const botaoNovaSecao = document.createElement('button');
      botaoNovaSecao.className = 'botao-mini botao-nova-secao';
      botaoNovaSecao.textContent = '+ Nova lista';
      botaoNovaSecao.onclick = criarSecao;
      lista.appendChild(botaoNovaSecao);
    }

    function criarSecao() {
      const nome = prompt('Nome da nova seção (ex: Kit Remédios):');
      if (!nome || !nome.trim()) return;

      if (!checklistAtual.secoes) checklistAtual.secoes = [];
      const idTemporario = 'tmp-' + Date.now();
      const novaSecao = { id: idTemporario, nome: nome.trim() };
      checklistAtual.secoes.push(novaSecao);
      renderizarItens();

      chamarBackend('criarSecao', { idPlanilha: idPlanilha, idChecklist: checklistAtual.id, nome: novaSecao.nome }).then(function (resultado) {
        if (!resultado.ok) {
          checklistAtual.secoes = checklistAtual.secoes.filter(s => s.id !== idTemporario);
          renderizarItens();
          alert(resultado.erro);
          return;
        }
        novaSecao.id = resultado.id;
      }).catch(function () {
        checklistAtual.secoes = checklistAtual.secoes.filter(s => s.id !== idTemporario);
        renderizarItens();
        alert('Falha de conexão ao criar a seção.');
      });
    }

    function excluirSecaoAtual(idSecao) {
      const secao = (checklistAtual.secoes || []).find(s => s.id === idSecao);
      if (!secao) return;
      if (!confirm('Excluir a seção "' + secao.nome + '" e todos os itens dela?')) return;

      const secoesAntigas = checklistAtual.secoes.slice();
      const itensAntigos = itensAtuais.slice();

      checklistAtual.secoes = checklistAtual.secoes.filter(s => s.id !== idSecao);
      itensAtuais.splice(0, itensAtuais.length, ...itensAtuais.filter(i => i.idSecao !== idSecao));
      renderizarItens();

      chamarBackendEmSegundoPlano('excluirSecao', { idPlanilha: idPlanilha, idSecao: idSecao }, function (erro) {
        checklistAtual.secoes = secoesAntigas;
        itensAtuais.splice(0, itensAtuais.length, ...itensAntigos);
        renderizarItens();
        alert(erro || 'Não foi possível excluir a seção.');
      });
    }

    function atualizarProgresso() {
      const total = itensAtuais.length;
      const feitos = itensAtuais.filter(i => i.marcado).length;
      const percentual = total ? Math.round((feitos / total) * 100) : 0;
      document.getElementById('progressoTexto').textContent = feitos + ' de ' + total + ' concluídos';
      document.getElementById('progressoPercentual').textContent = percentual + '%';
      document.getElementById('progressoBarra').style.width = percentual + '%';
    }

    // Arrastar e soltar para reordenar os itens. A alça e a própria linha
    // iniciam o arrasto; o alvo é definido pela linha sobre a qual o mouse
    // está quando o item é soltado.
    function ativarArrasto(linha, item) {
      linha.draggable = true;

      linha.ondragstart = (ev) => {
        idArrastado = item.id;
        ev.dataTransfer.effectAllowed = 'move';
        linha.classList.add('arrastando');
      };

      linha.ondragend = () => {
        linha.classList.remove('arrastando');
        idArrastado = null;
      };

      linha.ondragover = (ev) => {
        ev.preventDefault();
        if (idArrastado !== null && idArrastado !== item.id) {
          linha.classList.add('arrasto-sobre');
        }
      };

      linha.ondragleave = () => {
        linha.classList.remove('arrasto-sobre');
      };

      linha.ondrop = (ev) => {
        ev.preventDefault();
        linha.classList.remove('arrasto-sobre');
        moverItem(idArrastado, item.id);
      };
    }

    function moverItem(idOrigem, idDestino) {
      if (idOrigem === null || idOrigem === idDestino) return;

      const indiceOrigem = itensAtuais.findIndex(i => i.id === idOrigem);
      const indiceDestino = itensAtuais.findIndex(i => i.id === idDestino);
      if (indiceOrigem === -1 || indiceDestino === -1) return;

      const [itemMovido] = itensAtuais.splice(indiceOrigem, 1);
      itensAtuais.splice(indiceDestino, 0, itemMovido);
      itensAtuais.forEach((it, i) => { it.ordem = i + 1; });

      renderizarItens();
      persistirOrdem();
    }

    function persistirOrdem() {
      const ids = itensAtuais.map(i => i.id);
      chamarBackendEmSegundoPlano('reordenarItens', { idPlanilha: idPlanilha, idChecklist: checklistAtual.id, ids: ids }, function (erro) {
        alert('Não foi possível salvar a nova ordem: ' + erro);
      });
    }

    function toggleSelecao(idItem) {
      if (itensSelecionados.has(idItem)) {
        itensSelecionados.delete(idItem);
      } else {
        itensSelecionados.add(idItem);
      }
      renderizarItens();
    }

    function excluirItemUnico(idItem) {
      if (!confirm('Excluir este item?')) return;

      const indice = itensAtuais.findIndex(i => i.id === idItem);
      if (indice === -1) return;
      const [itemRemovido] = itensAtuais.splice(indice, 1);
      itensSelecionados.delete(idItem);
      renderizarItens();

      chamarBackendEmSegundoPlano('excluirItem', { idPlanilha: idPlanilha, idItem: idItem }, function (erro) {
        itensAtuais.splice(indice, 0, itemRemovido);
        renderizarItens();
        alert(erro);
      });
    }

    function renomearItemUnico(idItem) {
      const item = itensAtuais.find(i => i.id === idItem);
      if (!item) return;

      const descricaoAntiga = item.descricao;
      const descricao = prompt('Novo texto do item:', descricaoAntiga);
      if (!descricao || !descricao.trim() || descricao.trim() === descricaoAntiga) return;

      item.descricao = descricao.trim();
      renderizarItens();

      chamarBackendEmSegundoPlano('renomearItem', { idPlanilha: idPlanilha, idItem: idItem, descricao: item.descricao }, function (erro) {
        item.descricao = descricaoAntiga;
        renderizarItens();
        alert(erro);
      });
    }

    function excluirSelecionados() {
      if (!itensSelecionados.size) {
        alert('Marque ao menos um item para excluir.');
        return;
      }
      if (!confirm('Excluir ' + itensSelecionados.size + ' item(ns) marcado(s)?')) return;

      const idsParaExcluir = Array.from(itensSelecionados);
      const removidos = itensAtuais.filter(i => idsParaExcluir.includes(i.id));
      itensAtuais.splice(0, itensAtuais.length, ...itensAtuais.filter(i => !idsParaExcluir.includes(i.id)));
      itensSelecionados.clear();
      renderizarItens();

      for (const idItem of idsParaExcluir) {
        chamarBackendEmSegundoPlano('excluirItem', { idPlanilha: idPlanilha, idItem: idItem }, function (erro) {
          const item = removidos.find(i => i.id === idItem);
          if (item && !itensAtuais.some(i => i.id === idItem)) {
            itensAtuais.push(item);
            renderizarItens();
          }
        });
      }
    }

    function renomearChecklistAtual() {
      const nomeAntigo = checklistAtual.nome;
      const nome = prompt('Novo nome do checklist:', nomeAntigo);
      if (!nome || !nome.trim() || nome.trim() === nomeAntigo) return;

      checklistAtual.nome = nome.trim();
      document.getElementById('tituloChecklist').textContent = checklistAtual.nome;

      function enviar(token) {
        chamarBackendEmSegundoPlano('renomearChecklist', { idPlanilha: idPlanilha, idChecklist: checklistAtual.id, nome: checklistAtual.nome, tokenAgenda: token }, function (erro) {
          checklistAtual.nome = nomeAntigo;
          document.getElementById('tituloChecklist').textContent = nomeAntigo;
          alert(erro);
        });
      }

      // Se esse checklist já avisa na agenda, busca o token pra atualizar
      // o título do evento também; senão, só renomeia o checklist mesmo.
      if (checklistAtual.notificarAgenda) {
        obterTokenAgenda(enviar);
      } else {
        enviar(null);
      }
    }

    function excluirChecklistAtual() {
      if (!confirm('Excluir o checklist "' + checklistAtual.nome + '"? Os itens deixarão de aparecer.')) return;

      const checklistRemovido = checklistAtual;

      function enviar(token) {
        painel.checklists = painel.checklists.filter(c => c.id !== checklistRemovido.id);
        voltarParaLista();

        chamarBackendEmSegundoPlano('excluirChecklist', { idPlanilha: idPlanilha, idChecklist: checklistRemovido.id, tokenAgenda: token }, function (erro) {
          painel.checklists.push(checklistRemovido);
          renderizarGrade();
          alert(erro);
        });
      }

      // Se esse checklist já avisa na agenda, busca o token pra apagar o
      // evento também; senão, exclui direto.
      if (checklistRemovido.notificarAgenda) {
        obterTokenAgenda(enviar);
      } else {
        enviar(null);
      }
    }

    function alternarItem(idItem) {
      const item = itensAtuais.find(i => i.id === idItem);
      if (!item) return;
      item.marcado = !item.marcado;
      renderizarItens();

      chamarBackendEmSegundoPlano('marcarItem', { idPlanilha: idPlanilha, idItem: idItem, data: dataHoje, marcar: item.marcado }, function (erro) {
        item.marcado = !item.marcado;
        renderizarItens();
        alert(erro);
      });
    }

    function marcarTodos(valor) {
      for (const item of itensAtuais) {
        item.marcado = valor;
      }
      renderizarItens();

      for (const item of itensAtuais) {
        chamarBackendEmSegundoPlano('marcarItem', { idPlanilha: idPlanilha, idItem: item.id, data: dataHoje, marcar: valor }, function (erro) {
          alert(erro);
        });
      }
    }

    function adicionarItem(idSecao, campoSecao) {
      const campo = campoSecao || document.getElementById('campoNovoItem');
      const descricao = campo.value.trim();
      if (!descricao) return;

      const idTemporario = 'tmp-' + Date.now();
      const maiorOrdem = itensAtuais.reduce((max, i) => Math.max(max, i.ordem || 0), 0);
      const novoItem = { id: idTemporario, descricao: descricao, ordem: maiorOrdem + 1, marcado: false, idSecao: idSecao || '' };
      itensAtuais.push(novoItem);
      campo.value = '';
      renderizarItens();

      chamarBackend('adicionarItem', { idPlanilha: idPlanilha, idChecklist: checklistAtual.id, descricao: descricao, idSecao: idSecao || '' }).then(function (resultado) {
        if (!resultado.ok) {
          const i = itensAtuais.indexOf(novoItem);
          if (i !== -1) itensAtuais.splice(i, 1);
          renderizarItens();
          alert(resultado.erro);
          return;
        }
        novoItem.id = resultado.id;
      }).catch(function () {
        const i = itensAtuais.indexOf(novoItem);
        if (i !== -1) itensAtuais.splice(i, 1);
        renderizarItens();
        alert('Falha de conexão ao adicionar o item.');
      });
    }
  </script>
